name: V2 disposable App Service concurrency probe
'on':
  workflow_call:
    inputs:
      azure-tenant-id:
        required: true
        type: string
      client-id:
        required: true
        type: string
      principal-id:
        required: true
        type: string
      subscription-id:
        required: true
        type: string
      resource-group:
        required: true
        type: string
      app-name:
        required: true
        type: string
      expected-resource-id:
        required: true
        type: string
      probe-nonce:
        required: true
        type: string
      environment:
        required: true
        type: string
      allow-mutations:
        required: false
        type: boolean
        default: false
      confirmation:
        required: false
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
    - name: Check out the pinned staging probe implementation
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: v2-runner
        persist-credentials: false
        sparse-checkout: 'customer_runner

          backend/contracts

          '
        fetch-depth: 1
    - name: Inspect concurrency support; mutations require disposable exclusive confirmation
      env:
        V2_PROBE_AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
        V2_PROBE_CLIENT_ID: ${{ inputs.client-id }}
        V2_PROBE_PRINCIPAL_ID: ${{ inputs.principal-id }}
        V2_PROBE_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        V2_PROBE_RESOURCE_GROUP: ${{ inputs.resource-group }}
        V2_PROBE_APP_NAME: ${{ inputs.app-name }}
        V2_PROBE_EXPECTED_RESOURCE_ID: ${{ inputs.expected-resource-id }}
        V2_PROBE_PROBE_NONCE: ${{ inputs.probe-nonce }}
        V2_PROBE_ALLOW_MUTATIONS: ${{ inputs.allow-mutations }}
        V2_PROBE_CONFIRMATION: ${{ inputs.confirmation }}
      shell: bash
      run: python3 -I -c "import runpy, sys; sys.path.insert(0, 'v2-runner'); runpy.run_module('customer_runner.staging_probe',
        run_name='__main__')"
