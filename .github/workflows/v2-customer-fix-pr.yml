name: V2 reviewed draft pull request
'on':
  workflow_call:
    inputs:
      api-origin: { required: true, type: string }
      workspace-id: { required: true, type: string }
      project-id: { required: true, type: string }
      request-id: { required: false, type: string }
      request-sha256: { required: false, type: string }
      environment: { required: true, type: string }
      public-keys: { required: true, type: string }
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out the pinned publisher runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: customer_runner
      - name: Issue a repository-scoped customer GitHub App token
        id: draft-app
        if: vars.V2_DRAFT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.V2_DRAFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.V2_DRAFT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open and verify the approved draft
        env:
          V2_API_ORIGIN: ${{ inputs.api-origin }}
          V2_WORKSPACE_ID: ${{ inputs.workspace-id }}
          V2_PROJECT_ID: ${{ inputs.project-id }}
          V2_REQUEST_ID: ${{ inputs.request-id }}
          V2_REQUEST_SHA256: ${{ inputs.request-sha256 }}
          V2_PUBLIC_KEYS: ${{ inputs.public-keys }}
          V2_GITHUB_TOKEN: ${{ github.token }}
          V2_DRAFT_APP_CLIENT_ID: ${{ vars.V2_DRAFT_APP_CLIENT_ID }}
          V2_DRAFT_APP_TOKEN: ${{ steps.draft-app.outputs.token }}
        run: node customer_runner/draft_fix_pr.mjs
